apiVersion: v1
kind: Secret
metadata:
  name: {{ include "firn.fullname" . }}-config
  labels:
    {{- include "firn.labels" . | nindent 4 }}
stringData:
  config.yaml: |
    debug: {{ .Values.firn.debug }}

    catalog:
      type: {{ .Values.firn.catalog.type | quote }}
      {{- if .Values.firn.catalog.url }}
      url: {{ .Values.firn.catalog.url | quote }}
      {{- end }}
      {{- if .Values.firn.catalog.region }}
      region: {{ .Values.firn.catalog.region | quote }}
      {{- end }}
      credential:
        client_id: {{ .Values.firn.catalog.credential.clientId | quote }}
        client_secret: {{ .Values.firn.catalog.credential.clientSecret | quote }}
        {{- if .Values.firn.catalog.credential.tokenUri }}
        token_uri: {{ .Values.firn.catalog.credential.tokenUri | quote }}
        {{- end }}

    storage:
      type: {{ .Values.firn.storage.type | quote }}
      {{- if .Values.firn.storage.endpoint }}
      endpoint: {{ .Values.firn.storage.endpoint | quote }}
      {{- end }}
      region: {{ .Values.firn.storage.region | quote }}
      access_key_id: {{ .Values.firn.storage.accessKeyId | quote }}
      secret_access_key: {{ .Values.firn.storage.secretAccessKey | quote }}
      path_style: {{ .Values.firn.storage.pathStyle }}

    maintenance:
      defaults:
        compaction:
          enabled: {{ .Values.firn.maintenance.defaults.compaction.enabled }}
          strategy: {{ .Values.firn.maintenance.defaults.compaction.strategy | quote }}
          target_file_size_mb: {{ .Values.firn.maintenance.defaults.compaction.targetFileSizeMb }}
          min_file_count: {{ .Values.firn.maintenance.defaults.compaction.minFileCount }}
          min_file_age_minutes: {{ .Values.firn.maintenance.defaults.compaction.minFileAgeMinutes }}
          sort_keys: {{ toJson .Values.firn.maintenance.defaults.compaction.sortKeys }}
          z_order_columns: {{ toJson .Values.firn.maintenance.defaults.compaction.zOrderColumns }}
        snapshot_expiry:
          enabled: {{ .Values.firn.maintenance.defaults.snapshotExpiry.enabled }}
          min_snapshots_to_keep: {{ .Values.firn.maintenance.defaults.snapshotExpiry.minSnapshotsToKeep }}
          max_snapshot_age_hours: {{ .Values.firn.maintenance.defaults.snapshotExpiry.maxSnapshotAgeHours }}
        orphan_cleanup:
          enabled: {{ .Values.firn.maintenance.defaults.orphanCleanup.enabled }}
          grace_period_hours: {{ .Values.firn.maintenance.defaults.orphanCleanup.gracePeriodHours }}
      {{- if .Values.firn.maintenance.namespaces }}
      namespaces:
        {{- toYaml .Values.firn.maintenance.namespaces | nindent 8 }}
      {{- end }}
      {{- if .Values.firn.maintenance.tables }}
      tables:
        {{- toYaml .Values.firn.maintenance.tables | nindent 8 }}
      {{- end }}

    scheduler:
      interval: {{ .Values.firn.scheduler.interval | quote }}
      max_concurrent_jobs: {{ .Values.firn.scheduler.maxConcurrentJobs }}
      memory_limit: {{ .Values.firn.scheduler.memoryLimit | quote }}
      {{- if .Values.metrics.enabled }}
      metrics_addr: ":{{ .Values.metrics.port }}"
      {{- end }}
