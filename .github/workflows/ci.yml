name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./... -short -count=1
        env:
          CGO_ENABLED: "1"

      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: "1"
